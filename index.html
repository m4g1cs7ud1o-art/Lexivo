<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f2ec">
  <title>Lexivo | Englisch lernen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="simple.css">
  <script src="home.js" defer></script>
</head>
<body>
  <div class="page-shell">
    <header class="topbar">
      <span class="topbar-label">ENGLISCH · DEUTSCH</span>
      <a class="brand" href="./" aria-label="Lexivo Startseite">Lexivo</a>
    </header>

    <main>
      <section class="home-panel" aria-labelledby="page-title">
        <p class="eyebrow">DEIN ENGLISCH-LERNRAUM</p>
        <h1 id="page-title">Womit möchtest du lernen?</h1>
        <form class="home-code-form" id="home-code-form" novalidate>
          <label for="home-code">Gib deinen Klassencode ein</label>
          <input id="home-code" name="code" type="text" inputmode="numeric" autocomplete="off" maxlength="6" placeholder="000000" aria-describedby="home-code-message" autofocus>
          <button class="primary-button home-submit" type="submit">Klasse öffnen <span aria-hidden="true">→</span></button>
          <p class="message" id="home-code-message" role="status" aria-live="polite"></p>
        </form>
        <a class="all-lists-link" href="lists.html">Alle Vokabelsätze ansehen <span aria-hidden="true">↗</span></a>
      </section>
    </main>

    <footer class="footer">Lexivo <span>·</span> Englisch lernen, Wort für Wort</footer>
  </div>

  <dialog class="list-dialog" id="list-dialog" aria-labelledby="dialog-title">
    <div class="dialog-inner">
      <button class="dialog-close" id="dialog-close" type="button" aria-label="Liste schließen">×</button>
      <p class="dialog-class" id="dialog-class"></p>
      <h2 id="dialog-title">Vokabelsatz</h2>
      <p class="dialog-description" id="dialog-description"></p>
      <div class="word-list" id="dialog-words"></div>
    </div>
  </dialog>
</body>
</html>
