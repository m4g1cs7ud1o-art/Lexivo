name: Update vocabulary catalog

on:
  push:
    branches:
      - main
    paths:
      - "datas/**/*.json"
      - "scripts/generate-catalog.mjs"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate catalog from datas folders
        run: node scripts/generate-catalog.mjs

      - name: Commit changed catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datas/catalog.json
          if git diff --cached --quiet; then
            echo "Catalog is already up to date."
            exit 0
          fi
          git commit -m "Update generated vocabulary catalog"
          git push origin HEAD:main